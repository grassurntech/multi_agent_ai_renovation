[project]
name = "reno-agents"
version = "0.1.0"
description = "Open-source AI agents for the apartment renovation loop: inspect, scope, coordinate, verify."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reno_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Docs hold illustrative snippets; only real Python files are formatted.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
